# SOFIA Space Windows branding build, based on validated build #599.
name: Build
# Commander without maximize state
on:
  push:
    branches: [ "main", "experiment/sofi-osd-button", "experiment/l3-controller-mapper-direct", "experiment/osd-keyboard-tab-lock", "experiment/osd-mouse-joy-tab-lock", "experiment/hotkey-f11-controller-mapper", "experiment/sofi-shortcuts-bullets", "experiment/osk-half-right-anchor", "experiment/ui-language-switch", "feature/sofia-awe32-build9-test", "optimize/windows-tested-2026-11-14", "experiment/osd-left-rail-layout", "experiment/sofia-16x9-canvas", "experiment/video-options-layout", "experiment/commander-outer-frame", "experiment/commander-font-clean-234", "experiment/commander-move-up", "experiment/imgui-commander-view", "experiment/imgui-commander-resizable", "experiment/sofi-space-ui", "experiment/game-screen-takeover", "experiment/game-takeover-plus-alt178", "experiment/commander-window-persistence", "experiment/commander-explorer-autominimize", "experiment/commander-window-controls", "experiment/explorer-three-state-toggle", "experiment/commander-titlebar-controls", "experiment/commander-window-state-controls", "experiment/commander-maximize-735x980", "experiment/sofi-ui-clear-navigation", "experiment/commander-focus-independent-ui", "experiment/video-panel-visual", "diagnostic/midi-logging", "diagnostic/midi-no-splash", "experiment/game-launcher", "branding/sofia-space-windows", "experiment/automatic-pure-reset", "experiment/neon-blue-background-656" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      versionstring:
        description: 'Version String'
        default: ''
        required: false
        type: string

jobs:
  build-win64-msvc:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@main
      with:
        path: main
        fetch-depth: 0
    - uses: microsoft/setup-msbuild@main
    - name: Checkout Deps
      run: |
        git clone https://github.com/anydream/dosbox-pure.git dosbox-pure
        git -C dosbox-pure checkout 9cccfa21cb117edf94fbcd1a26b2dee8b12db598
        python main/tools/patch_sofi_automatic_pure_reset.py
        if ($LASTEXITCODE -ne 0) { throw "Failed to install automatic DOSBox Pure post-game reset" }
        python main/tools/patch_osd_keyboard_size.py
        if ($LASTEXITCODE -ne 0) { throw "Failed to patch native DOSBox Pure OSD keyboard size/position" }
        perl -0pi -e 's/DBPS_OSD_WIDTH = 640, DBPS_OSD_HEIGHT = 480/DBPS_OSD_WIDTH = 960, DBPS_OSD_HEIGHT = 540/' dosbox-pure/dosbox_pure_sta.h
        if (-not (Select-String -Path dosbox-pure/dosbox_pure_sta.h -Pattern 'DBPS_OSD_WIDTH = 960, DBPS_OSD_HEIGHT = 540' -Quiet)) { throw "16:9 OSD canvas was not configured" }
        perl -0pi -e 's/\{ "integer", "Integer Scaling" \},/\{ "integer", "Integer Scaling" \},\n\t\t\t\{ "xbrz", "xBRZ 4x" \},/' dosbox-pure/core_options.h
        perl -0pi -e 's/"sb16", "gb"/"sb16", "awe32", "gb"/; s/Type of Soundblaster to emulate\. gb is Gameblaster\./Type of Soundblaster to emulate. awe32 enables the EMU8000 wavetable when awe32.raw is available; gb is Gameblaster./' dosbox-pure/src/dosbox.cpp
        git -C dosbox-pure apply --recount --ignore-whitespace "$env:GITHUB_WORKSPACE/main/patches/dosbox-pure-awe32-emu8k-core.patch"
        if ($LASTEXITCODE -ne 0) { throw "Failed to apply EMU8000/AWE32 core patch" }
        git -C dosbox-pure apply --recount --ignore-whitespace "$env:GITHUB_WORKSPACE/main/patches/dosbox-pure-midi-manual-override.patch"
        if ($LASTEXITCODE -ne 0) { throw "Failed to apply manual MIDI override core patch" }
        if (-not (Select-String -Path dosbox-pure/dosbox_pure_libretro.cpp -Pattern 'manual_midi_override' -Quiet)) { throw "Manual MIDI override was not installed" }
        if ($LASTEXITCODE -ne 0) { throw "Failed to apply EMU8000/AWE32 core patch" }
        if (-not (Select-String -Path dosbox-pure/core_options.h -Pattern 'SoundBlaster AWE32' -Quiet)) { throw "AWE32 core option was not added" }
        if (-not (Select-String -Path dosbox-pure/src/hardware/sblaster.cpp -Pattern 'SBT_AWE32' -Quiet)) { throw "AWE32 Sound Blaster integration was not added" }
        if (-not (Select-String -Path dosbox-pure/src/hardware/sblaster.cpp -Pattern 'AWE32_OpenROMBesideExe' -Quiet)) { throw "AWE32 ROM loader was not added" }
        git clone --single-branch --branch main --depth 1 https://github.com/${{ github.repository_owner }}/ZillaLib.git ZillaLib
        python main/tools/patch_zillalib_imgui.py
        git clone --single-branch --branch v1.91.9b --depth 1 https://github.com/ocornut/imgui.git imgui
        Add-Type -AssemblyName System.Drawing
        $skinPng = Join-Path $env:GITHUB_WORKSPACE "main/neon_blue.png"
        $skinJpg = Join-Path $env:GITHUB_WORKSPACE "main/neon_blue.jpg"
        $jpegEncoder = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq "image/jpeg" } | Select-Object -First 1
        if (-not $jpegEncoder) { throw "JPEG encoder is unavailable" }
        $skinImage = [System.Drawing.Image]::FromFile($skinPng)
        $jpegParams = [System.Drawing.Imaging.EncoderParameters]::new(1)
        try {
          $jpegParams.Param[0] = [System.Drawing.Imaging.EncoderParameter]::new([System.Drawing.Imaging.Encoder]::Quality, [long]90)
          $skinImage.Save($skinJpg, $jpegEncoder, $jpegParams)
        } finally {
          $jpegParams.Dispose()
          $skinImage.Dispose()
        }
        if (-not (Test-Path $skinJpg)) { throw "Neon Blue JPEG conversion failed" }
        python main/tools/embed_splash.py
        python main/tools/patch_osd_sidebar.py
        python main/tools/patch_osd_cursor.py
        python main/tools/patch_dosbox_pure_controller_mapper.py
        python main/tools/patch_osd_disable_keyboard_tab_navigation.py
        python main/tools/patch_osd_disable_mouse_joy_tab_navigation.py
        python main/tools/patch_sofi_controller_mapper_hotkey.py
        python main/tools/patch_sofi_shortcuts_bullets.py
    - if: ${{ github.event.inputs.versionstring == '' }}
      run: perl -i -pe "s/\"(.*)\"/\"\1-${GITHUB_SHA::7}\"/g" dosbox-pure/dosbox_pure_ver.h
      shell: bash
    - if: ${{ github.event.inputs.versionstring != '' }}
      run: perl -i -pe "s/\".*\"/\"${{ github.event.inputs.versionstring }}\"/g" dosbox-pure/dosbox_pure_ver.h
      shell: bash
    - run: echo "::add-matcher::main/.github/workflows/msvc-problem-matcher.json"
    - name: Build
      run: |
        cd main
        MSBuild.exe DOSBoxPure-vs.vcxproj /p:Configuration=ReleaseGLCORE /p:Platform=x64
    - uses: actions/upload-artifact@main
      with:
        name: sofia-space_win64
        path: |
          main/Release-vs2026x64/SOFIA Space.exe
          main/README.md

