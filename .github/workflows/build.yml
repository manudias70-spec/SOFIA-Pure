name: Build
on:
  push:
    branches: [ "main", "feature/xbrz-glsl", "feature/awe32-build9", "feature/awe32-build9-clean2" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      versionstring:
        description: 'Version String'
        default: ''
        required: false
        type: string

jobs:
  build-win64-msvc:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@main
      with:
        path: main
        fetch-depth: 0
    - uses: microsoft/setup-msbuild@main
    - name: Checkout Deps
      run: |
        git clone https://github.com/anydream/dosbox-pure.git dosbox-pure
        git -C dosbox-pure checkout 9cccfa21cb117edf94fbcd1a26b2dee8b12db598
        git -C dosbox-pure apply ../main/patches/dosbox-pure-xbrz-options.patch
        git -C dosbox-pure apply ../main/patches/dosbox-pure-awe32-emu8k-core.patch
        git -C dosbox-pure apply ../main/patches/dosbox-pure-awe32-exedir.patch
        git clone --single-branch --branch main --depth 1 https://github.com/${{ github.repository_owner }}/ZillaLib.git ZillaLib
    - if: ${{ github.event.inputs.versionstring == '' }}
      run: perl -i -pe "s/\"(.*)\"/\"\1-${GITHUB_SHA::7}\"/g" dosbox-pure/dosbox_pure_ver.h
      shell: bash
    - if: ${{ github.event.inputs.versionstring != '' }}
      run: perl -i -pe "s/\".*\"/\"${{ github.event.inputs.versionstring }}\"/g" dosbox-pure/dosbox_pure_ver.h
      shell: bash
    - run: echo "::add-matcher::main/.github/workflows/msvc-problem-matcher.json"
    - name: Build
      run: |
        cd main
        MSBuild.exe DOSBoxPure-vs.vcxproj /p:Configuration=ReleaseGLCORE /p:Platform=x64
    - uses: actions/upload-artifact@main
      with:
        name: dosbox-pure-unleashed_win64
        path: main/Release-vs2026x64/DOSBoxPure.exe

