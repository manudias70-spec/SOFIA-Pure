name: Build
on:
  push:
    branches: [ "main", "feature/sofia-awe32-build9-test", "optimize/windows-tested-2026-11-14" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      versionstring:
        description: 'Version String'
        default: ''
        required: false
        type: string

jobs:
  build-win64-msvc:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@main
      with:
        path: main
        fetch-depth: 0
    - uses: microsoft/setup-msbuild@main
    - name: Checkout Deps
      run: |
        git clone https://github.com/anydream/dosbox-pure.git dosbox-pure
        git -C dosbox-pure checkout 9cccfa21cb117edf94fbcd1a26b2dee8b12db598
        perl -0pi -e 's/\{ "integer", "Integer Scaling" \},/\{ "integer", "Integer Scaling" \},\n\t\t\t\{ "xbrz", "xBRZ 4x" \},/' dosbox-pure/core_options.h
        perl -0pi -e 's/"sb16", "gb"/"sb16", "awe32", "gb"/; s/Type of Soundblaster to emulate\. gb is Gameblaster\./Type of Soundblaster to emulate. awe32 enables the EMU8000 wavetable when awe32.raw is available; gb is Gameblaster./' dosbox-pure/src/dosbox.cpp
        git -C dosbox-pure apply --recount --ignore-whitespace "$env:GITHUB_WORKSPACE/main/patches/dosbox-pure-awe32-emu8k-core.patch"
        if ($LASTEXITCODE -ne 0) { throw "Failed to apply EMU8000/AWE32 core patch" }
        perl -0pi -e 's/("dosbox_pure_cpu_core".*?\n\s*)"auto"(\n\s*#endif)/$1"dynamic"$2/s or die "Could not set Dynamic CPU core default";' dosbox-pure/core_options.h
        if (-not (Select-String -Path dosbox-pure/core_options.h -Pattern 'SoundBlaster AWE32' -Quiet)) { throw "AWE32 core option was not added" }
        if (-not (Select-String -Path dosbox-pure/src/hardware/sblaster.cpp -Pattern 'SBT_AWE32' -Quiet)) { throw "AWE32 Sound Blaster integration was not added" }
        if (-not (Select-String -Path dosbox-pure/src/hardware/sblaster.cpp -Pattern 'AWE32_OpenROMBesideExe' -Quiet)) { throw "AWE32 ROM loader was not added" }
        git clone --single-branch --branch main --depth 1 https://github.com/${{ github.repository_owner }}/ZillaLib.git ZillaLib
        python main/tools/embed_splash.py
    - if: ${{ github.event.inputs.versionstring == '' }}
      run: perl -i -pe "s/\"(.*)\"/\"\1-${GITHUB_SHA::7}\"/g" dosbox-pure/dosbox_pure_ver.h
      shell: bash
    - if: ${{ github.event.inputs.versionstring != '' }}
      run: perl -i -pe "s/\".*\"/\"${{ github.event.inputs.versionstring }}\"/g" dosbox-pure/dosbox_pure_ver.h
      shell: bash
    - run: echo "::add-matcher::main/.github/workflows/msvc-problem-matcher.json"
    - name: Build
      run: |
        cd main
        MSBuild.exe DOSBoxPure-vs.vcxproj /p:Configuration=ReleaseGLCORE /p:Platform=x64
    - uses: actions/upload-artifact@main
      with:
        name: dosbox-pure-unleashed_win64
        path: main/Release-vs2026x64/DOSBoxPure.exe

  build-win32-msvc:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@main
      with:
        path: main
        fetch-depth: 0
    - uses: microsoft/setup-msbuild@main
    - name: Checkout Deps
      run: |
        git clone https://github.com/anydream/dosbox-pure.git dosbox-pure
        git -C dosbox-pure checkout 9cccfa21cb117edf94fbcd1a26b2dee8b12db598
        perl -0pi -e 's/\{ "integer", "Integer Scaling" \},/\{ "integer", "Integer Scaling" \},\n\t\t\t\{ "xbrz", "xBRZ 4x" \},/' dosbox-pure/core_options.h
        perl -0pi -e 's/"sb16", "gb"/"sb16", "awe32", "gb"/; s/Type of Soundblaster to emulate\. gb is Gameblaster\./Type of Soundblaster to emulate. awe32 enables the EMU8000 wavetable when awe32.raw is available; gb is Gameblaster./' dosbox-pure/src/dosbox.cpp
        git -C dosbox-pure apply --recount --ignore-whitespace "$env:GITHUB_WORKSPACE/main/patches/dosbox-pure-awe32-emu8k-core.patch"
        if ($LASTEXITCODE -ne 0) { throw "Failed to apply EMU8000/AWE32 core patch" }
        perl -0pi -e 's/("dosbox_pure_cpu_core".*?\n\s*)"auto"(\n\s*#endif)/$1"dynamic"$2/s or die "Could not set Dynamic CPU core default";' dosbox-pure/core_options.h
        if (-not (Select-String -Path dosbox-pure/src/hardware/sblaster.cpp -Pattern 'SBT_AWE32' -Quiet)) { throw "AWE32 Sound Blaster integration was not added" }
        git clone --single-branch --branch main --depth 1 https://github.com/${{ github.repository_owner }}/ZillaLib.git ZillaLib
        python main/tools/embed_splash.py
    - if: ${{ github.event.inputs.versionstring == '' }}
      run: perl -i -pe "s/\"(.*)\"/\"\1-${GITHUB_SHA::7}\"/g" dosbox-pure/dosbox_pure_ver.h
      shell: bash
    - if: ${{ github.event.inputs.versionstring != '' }}
      run: perl -i -pe "s/\".*\"/\"${{ github.event.inputs.versionstring }}\"/g" dosbox-pure/dosbox_pure_ver.h
      shell: bash
    - run: echo "::add-matcher::main/.github/workflows/msvc-problem-matcher.json"
    - name: Build
      run: |
        cd main
        MSBuild.exe DOSBoxPure-vs.vcxproj /p:Configuration=ReleaseGLCORE /p:Platform=Win32
    - uses: actions/upload-artifact@main
      with:
        name: dosbox-pure-unleashed_win32
        path: main/Release-vs2026/DOSBoxPure.exe
